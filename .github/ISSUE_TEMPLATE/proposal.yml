name: Repository change or investigation
description: Propose a template or repository change, or request investigation.
title: ""
body:
  - type: textarea
    id: proposal
    attributes:
      label: What should be considered?
      description: Describe the proposed change or question to investigate.
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Affected area
      description: Name the template, file, tool, or repository area when known.
  - type: textarea
    id: reason
    attributes:
      label: Why does it matter?
      description: Describe the need, expected benefit, or consequence.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Evidence or context
      description: Add examples, links, prior discussion, or constraints when useful.
